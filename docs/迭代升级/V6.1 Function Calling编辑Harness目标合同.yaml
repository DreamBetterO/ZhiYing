  source_code_implementation: false
  real_cloud_requests: false
  cloud_image_upload: false
  model_download_or_change: false
  dependency_install_or_reinstall: false
  long_video_rerun: false
  portable_rebuild: false

definition_of_done:
  - "EditorialAgentSubgraph is the only production document editorial path."
  - "Function Calling, structured cloud and pure local paths pass the same output contract."
  - "Editorial calls use Blueprint + Writer while knowledge units are bounded per unit; all conditional calls remain within the per-video budget."
  - "No production v3_to_v2 rendering remains."
  - "Forbidden legacy visible sections are not injected."
  - "Confirmed math equations map to Word OMML."
  - "The two high-math golden outputs do not expose long raw erroneous ASR as polished rules or steps."
  - "Images have role, source, caption, alt text and duplicate control; cloud image requests stay zero."
  - "Local no-cloud execution produces Document v3.1, Markdown, Word and PDF with truthful status."
  - "Stage provenance and degraded UI labels are truthful."
  - "Checkpoint/cache replay produces zero duplicate cost for successful cloud/tool turns."
  - "Diagnostics identify owner, error code, revision and suggested rerun node."
  - "All targeted, golden, fault, UI and complete offline acceptance tests pass."
  - "Product runs as formal 1.0.0 and V6.1 completion is confirmed by the user."
