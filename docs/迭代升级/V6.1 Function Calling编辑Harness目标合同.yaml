    - audio
    - transcript
    - frame_candidates
    - selected_frames
    - visual_evidence
    - course_ir
  default_invalidate_from: evidence.reconcile
  old_document_v2_v3: read_only
  old_workspace_delete: false
  old_output_overwrite: false
  checkpoint_cross_graph_version_migration: false
  rollback_baseline: "V6.0 / 1.0.0rc1"
  v6_1_candidate_version: "1.0.0rc2"
  active_product_version: "1.0.0"

diagnostics:
