closed_decisions:
  - "LangGraph 继续是唯一生产编排器；编辑能力以显式 EditorialAgentSubgraph 接入，不建立第二编排器。"
  - "主图决定阶段、预算、降级、重试、质量门与终态；LLM只决定文档语义和阶段内工具调用。"
  - "Function Calling 使用受限、分阶段工具集；禁止任意文件、Shell、网络、MCP、图片上传和无限循环。"
  - "能力链固定为 tool_native → structured_only → local_deterministic；无需新本地文本模型即可完整产出。"
  - "编辑阶段默认 Blueprint + Writer；知识整理按 unit 有界分批；观察、局部修订和证据纠错只按失败门触发并共享总预算。"
  - "Markdown、Word、PDF 原生消费 Document v3.1；生产不再 v3 → v2，历史 v2 只读。"
  - "允许降级产物自动输出，但必须标记 degraded、实际模型链、原因和未满足质量项。"
  - "云端图片默认禁止，仅保留未来独立能力接口；MCP、多Agent、Web服务与通用插件不进入V6.1。"
  - "用户已于 2026-08-24 确认产品正式版本为 1.0.0，并于 2026-09-03 确认 CP61-7/CP61-8 与 V6.1 整体验收完成。"

active_runtime_warning:
