  - "云端知识整理采用单知识单元有界分批；来源与组件结构必须收敛到本地权威合同，禁止因模型 ID 漂移整段降级。"
  - "active docs/architecture 已切换为 GraphRuntime；不得恢复旧 PipelineRunner 双执行路径。"

