<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="desktopGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="cliGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="pipelineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="knowledgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="infraGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="renderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">知影 · 整体架构图</text>
  <text x="550" y="58" text-anchor="middle" font-size="12" fill="#64748b">V4.0 / video-study 0.4.0</text>

  <!-- ========== Layer 1: User Entry ========== -->
  <rect x="60" y="80" width="980" height="100" rx="10" fill="url(#cliGrad)" stroke="#7dd3fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="104" font-size="13" font-weight="600" fill="#0369a1">用户入口层</text>

  <!-- Desktop -->
  <rect x="100" y="115" width="200" height="50" rx="8" fill="url(#desktopGrad)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#0c4a6e">桌面端 desktop/</text>
  <text x="200" y="154" text-anchor="middle" font-size="10" fill="#075985">Controller · Tk View · ETA</text>

  <!-- CLI -->
  <rect x="340" y="115" width="200" height="50" rx="8" fill="url(#cliGrad)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#0c4a6e">命令行 cli.py</text>
  <text x="440" y="154" text-anchor="middle" font-size="10" fill="#075985">doctor · run · desktop · play-url</text>

  <!-- Protocol -->
  <rect x="580" y="115" width="200" height="50" rx="8" fill="url(#cliGrad)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#0c4a6e">本地协议 localplay.py</text>
  <text x="680" y="154" text-anchor="middle" font-size="10" fill="#075985">video-study:// · ffplay 定位</text>

  <!-- Config -->
  <rect x="820" y="115" width="200" height="50" rx="8" fill="url(#cliGrad)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="920" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#0c4a6e">配置 config.py</text>
  <text x="920" y="154" text-anchor="middle" font-size="10" fill="#075985">config.yaml + api.yaml + .env</text>

  <!-- Arrows from entry to pipeline -->
  <line x1="200" y1="165" x2="200" y2="205" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="165" x2="440" y2="205" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== Layer 2: Main Pipeline ========== -->
  <rect x="60" y="200" width="980" height="130" rx="10" fill="url(#pipelineGrad)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="224" font-size="13" font-weight="600" fill="#92400e">执行内核 — StepRegistry + PipelineRunner</text>

  <!-- Pipeline stages -->
  <rect x="90" y="240" width="160" height="70" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="170" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">① 音频提取</text>
  <text x="170" y="278" text-anchor="middle" font-size="10" fill="#92400e">media.py · ffmpeg</text>
  <text x="170" y="294" text-anchor="middle" font-size="9" fill="#a16207">16kHz mono FLAC</text>

  <rect x="280" y="240" width="160" height="70" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="360" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">② 语音识别</text>
  <text x="360" y="278" text-anchor="middle" font-size="10" fill="#92400e">asr.py · faster-whisper</text>
  <text x="360" y="294" text-anchor="middle" font-size="9" fill="#a16207">GPU/CPU · 术语纠正</text>

  <rect x="470" y="240" width="160" height="70" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="550" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">③ 关键帧提取</text>
  <text x="550" y="278" text-anchor="middle" font-size="10" fill="#92400e">frames.py · Pillow</text>
  <text x="550" y="294" text-anchor="middle" font-size="9" fill="#a16207">场景聚类 · 熵筛选</text>

  <rect x="660" y="240" width="160" height="70" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="740" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">④ 知识整理</text>
  <text x="740" y="278" text-anchor="middle" font-size="10" fill="#92400e">execution/steps/knowledge.py</text>
  <text x="740" y="294" text-anchor="middle" font-size="9" fill="#a16207">8 个知识 Step</text>

  <rect x="850" y="240" width="160" height="70" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="930" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">⑤ 文档生成</text>
  <text x="930" y="278" text-anchor="middle" font-size="10" fill="#92400e">render.py</text>
  <text x="930" y="294" text-anchor="middle" font-size="9" fill="#a16207">MD · Word · PDF</text>

  <!-- Arrows between stages -->
  <line x1="250" y1="275" x2="280" y2="275" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="440" y1="275" x2="470" y2="275" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="630" y1="275" x2="660" y2="275" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="820" y1="275" x2="850" y2="275" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <!-- Arrow from pipeline to knowledge -->
  <line x1="740" y1="310" x2="740" y2="355" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ========== Layer 3: Knowledge Subsystem ========== -->
  <rect x="60" y="350" width="980" height="150" rx="10" fill="url(#knowledgeGrad)" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="374" font-size="13" font-weight="600" fill="#166534">知识子系统 knowledge/ — LessonPlan → CourseIR → Document v2</text>

  <!-- Knowledge steps -->
  <rect x="80" y="390" width="150" height="55" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="155" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">课程规划</text>
  <text x="155" y="425" text-anchor="middle" font-size="9" fill="#166534">planning.py</text>
  <text x="155" y="438" text-anchor="middle" font-size="9" fill="#166534">LessonPlan</text>

  <rect x="250" y="390" width="150" height="55" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="325" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">视觉证据</text>
  <text x="325" y="425" text-anchor="middle" font-size="9" fill="#166534">visual_retrieval.py</text>
  <text x="325" y="438" text-anchor="middle" font-size="9" fill="#166534">VLM 会话 · 像素核验</text>

  <rect x="420" y="390" width="150" height="55" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="495" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">知识整理</text>
  <text x="495" y="425" text-anchor="middle" font-size="9" fill="#166534">organizer.py</text>
  <text x="495" y="438" text-anchor="middle" font-size="9" fill="#166534">CourseIR · CloudPayload</text>

  <rect x="590" y="390" width="140" height="55" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="660" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">自检</text>
  <text x="660" y="425" text-anchor="middle" font-size="9" fill="#166534">selfcheck.py</text>
  <text x="660" y="438" text-anchor="middle" font-size="9" fill="#166534">覆盖/来源校验</text>

  <rect x="750" y="390" width="140" height="55" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="820" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">适配器</text>
  <text x="820" y="425" text-anchor="middle" font-size="9" fill="#166534">adapter.py</text>
  <text x="820" y="438" text-anchor="middle" font-size="9" fill="#166534">→ document.json v2</text>

  <rect x="910" y="390" width="120" height="55" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="970" y="410" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">去重</text>
  <text x="970" y="425" text-anchor="middle" font-size="9" fill="#166534">dedup.py</text>
  <text x="970" y="438" text-anchor="middle" font-size="9" fill="#166534">exact + near-dup</text>

  <!-- Knowledge flow arrows -->
  <line x1="230" y1="417" x2="250" y2="417" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <line x1="400" y1="417" x2="420" y2="417" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <line x1="570" y1="417" x2="590" y2="417" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <line x1="730" y1="417" x2="750" y2="417" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <line x1="890" y1="417" x2="910" y2="417" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrowGreen)"/>

  <!-- Cloud / Offline labels -->
  <rect x="200" y="460" width="300" height="26" rx="6" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
  <text x="350" y="477" text-anchor="middle" font-size="10" fill="#854d0e">☁ 云端模式：LLM 规划 + CourseIR 紧凑载荷分批整理</text>

  <rect x="540" y="460" width="300" height="26" rx="6" fill="#ecfccb" stroke="#84cc16" stroke-width="1"/>
  <text x="690" y="477" text-anchor="middle" font-size="10" fill="#3f6212">🖥 离线模式：启发式规划 + CourseIR 去重 + 本地整理</text>

  <!-- Arrow from knowledge to render -->
  <line x1="930" y1="310" x2="930" y2="200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" transform="translate(0,160)"/>

  <!-- ========== Layer 4: Render ========== -->
  <rect x="60" y="640" width="980" height="80" rx="10" fill="url(#renderGrad)" stroke="#fb923c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="664" font-size="13" font-weight="600" fill="#7c2d12">渲染层 render.py</text>

  <rect x="100" y="675" width="250" height="35" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="225" y="697" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">Markdown — render_markdown()</text>

  <rect x="390" y="675" width="250" height="35" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="515" y="697" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">Word — render_docx() · Node.js</text>

  <rect x="680" y="675" width="250" height="35" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="805" y="697" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">PDF — Word COM / reportlab</text>

  <!-- Arrow pipeline→render -->
  <line x1="930" y1="310" x2="930" y2="640" stroke="#fb923c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>

  <!-- ========== Layer 5: Infrastructure ========== -->
  <rect x="60" y="740" width="980" height="65" rx="10" fill="url(#infraGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="764" font-size="13" font-weight="600" fill="#581c87">基础设施层</text>

  <rect x="90" y="775" width="140" height="22" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
  <text x="160" y="790" text-anchor="middle" font-size="10" fill="#6b21a8">providers.py · 云端模型</text>

  <rect x="250" y="775" width="140" height="22" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
  <text x="320" y="790" text-anchor="middle" font-size="10" fill="#6b21a8">progress.py · ETA</text>

  <rect x="410" y="775" width="140" height="22" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
  <text x="480" y="790" text-anchor="middle" font-size="10" fill="#6b21a8">media.py · ffmpeg/CUDA</text>

  <rect x="570" y="775" width="140" height="22" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
  <text x="640" y="790" text-anchor="middle" font-size="10" fill="#6b21a8">runtime.py · 工具查找</text>

  <rect x="730" y="775" width="140" height="22" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
  <text x="800" y="790" text-anchor="middle" font-size="10" fill="#6b21a8">utils.py · 通用工具</text>

  <rect x="890" y="775" width="140" height="22" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
  <text x="960" y="790" text-anchor="middle" font-size="10" fill="#6b21a8">localplay.py · 播放协议</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="60" y="50" width="980" height="2" fill="#cbd5e1"/>
</svg>
