cache_reasons:
  CACHE_HIT: "产物及指纹有效，无需重跑"
  LEGACY_ADOPTED: "旧 Workspace 已单向认领，无需模型初始化"
  NO_RECORD: "无 Step 缓存记录，从该 Step 执行"
  FORCED: "用户显式强制该 Step"
  STEP_VERSION_CHANGED: "实现版本变化，从该 Step 局部重跑"
  CONTRACT_CHANGED: "Artifact 合同变化，从该 Step 局部重跑"
  UPSTREAM_CHANGED: "上游 Artifact 变化，从该 Step 向下游重跑"
  CONFIG_CHANGED: "声明的配置指纹变化，从该 Step 向下游重跑"
  CAPABILITY_INSUFFICIENT: "缓存能力低于本次请求（如 offline→cloud）"
  OUTPUT_MISSING: "缓存记录存在但产物缺失"
  OUTPUT_CORRUPT: "产物摘要或结构校验失败"
  PREVIOUS_RUN_INCOMPLETE: "缓存记录不完整或损坏"
runtime_events:
  course_ir_offline_fallback:
    owner: zhiying.knowledge.organizer
    step_id: knowledge.units
    first_artifact: knowledge.units
    tests: [tests/test_knowledge_organizer.py, tests/test_cloud_payload.py]
    safe_rerun_from: knowledge.units
    policy: "先在当前 plan 的 CourseIR 授权集合内规范化 plan/source/claim 引用；无法安全恢复时才降级"
  run_degraded:
    owner: zhiying.execution.graph_runtime
    step_id: run
    safe_rerun_from: "诊断报告指出的首个 degraded step"
    policy: "不得只看 editorial.session；必须同时检查所有 step_state 与 notable_events"
