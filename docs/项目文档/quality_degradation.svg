<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
  <title id="title">知影当前质量检查与降级形成方式</title>
  <desc id="desc">内容结构经过来源、用户要求、公式和图片字段检查，页面报告检查结构性分页风险，渲染后核对Word公式、Markdown路径和PDF存在性；能力回退累积为降级，必需节点失败才形成失败。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#111827}.title{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#4b5563}.h{font-size:17px;font-weight:700}.t{font-size:13px}.note{font-size:12px;fill:#4b5563}.box{fill:#fff;stroke:#374151;stroke-width:1.5}.focus{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.flow{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#arrow)}.retry{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:6 5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="780" fill="#fff"/>
  <text x="640" y="42" text-anchor="middle" class="title">质量问题定位到组件，能力损失累积成降级</text>
  <text x="640" y="69" text-anchor="middle" class="sub">下图只描述当前已实现的检查；页面审计是结构级规则，不是像素级视觉对版</text>

  <rect x="35" y="185" width="170" height="130" rx="5" class="box"/>
  <text x="120" y="221" text-anchor="middle" class="h">统一内容结构</text>
  <text x="120" y="253" text-anchor="middle" class="t">段落 · 列表 · 公式</text>
  <text x="120" y="280" text-anchor="middle" class="t">图片 · 来源 · 用户要求</text>

  <path d="M205 250H250" class="flow"/>
  <rect x="250" y="125" width="290" height="250" rx="5" class="focus"/>
  <text x="395" y="161" text-anchor="middle" class="h">内容审计</text>
  <text x="280" y="201" class="t">事实组件是否带 source_refs</text>
  <text x="280" y="234" class="t">公式是否带 LaTeX</text>
  <text x="280" y="267" class="t">图片是否有职责、说明、替代文本</text>
  <text x="280" y="300" class="t">用户必须项是否缺失</text>
  <text x="280" y="333" class="t">用户禁止项是否出现</text>
  <text x="395" y="358" text-anchor="middle" class="note">错误定位到具体组件</text>

  <path d="M540 250H585" class="flow"/>
  <rect x="585" y="145" width="255" height="210" rx="5" class="box"/>
  <text x="712" y="181" text-anchor="middle" class="h">结构级页面报告</text>
  <text x="615" y="221" class="t">章节末尾孤立标题 / 分页</text>
  <text x="615" y="254" class="t">连续 page_break</text>
  <text x="615" y="287" class="t">固定编号样式残留</text>
  <text x="712" y="329" text-anchor="middle" class="note">不检查像素溢出或图片清晰度</text>

  <path d="M840 250H885" class="flow"/>
  <rect x="885" y="125" width="350" height="250" rx="5" class="focus"/>
  <text x="1060" y="161" text-anchor="middle" class="h">渲染后核验</text>
  <text x="915" y="201" class="t">Word：OMML 数量 = 公式组件数</text>
  <text x="915" y="234" class="t">Markdown：无本地绝对路径泄露</text>
  <text x="915" y="267" class="t">PDF：文件存在且非空</text>
  <text x="915" y="300" class="t">保留实际 PDF 渲染模式</text>
  <text x="1060" y="342" text-anchor="middle" class="note">当前不是三格式逐页视觉比对</text>

  <path d="M395 375V430H620" class="retry"/>
  <rect x="620" y="405" width="275" height="110" rx="5" class="box"/>
  <text x="757" y="441" text-anchor="middle" class="h">有限修订</text>
  <text x="757" y="472" text-anchor="middle" class="t">工具能力可用时提交局部 Patch</text>
  <text x="757" y="497" text-anchor="middle" class="note">最多一次循环，之后重新审计</text>
  <path d="M620 460H565V360H540" class="retry"/>

  <rect x="35" y="570" width="1200" height="145" rx="5" class="box"/>
  <text x="635" y="606" text-anchor="middle" class="h">降级来自前面每一步的真实能力回退</text>
  <text x="70" y="643" class="t">ASR：GPU → CPU，或显存不足降低批量</text>
  <text x="440" y="643" class="t">视觉：VLM → OCR / 规则 → no_match</text>
  <text x="825" y="643" class="t">云端：工具调用 → 结构化模型链 → 本地编辑</text>
  <text x="70" y="677" class="t">质量：有限修订后仍有问题</text>
  <text x="440" y="677" class="t">渲染：公式、路径或 PDF 核验失败</text>
  <text x="825" y="677" class="t">节点：成功 / 降级 / 失败 / 取消</text>

  <path d="M1060 375V545H1035V570" class="flow"/>
  <text x="640" y="755" text-anchor="middle" class="sub">完整产物可以带 degraded 交付；必需产物缺失或不可恢复节点错误才进入 failed</text>
</svg>
