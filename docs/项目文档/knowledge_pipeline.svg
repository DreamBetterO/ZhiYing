<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">知影知识与编辑流程</title>
  <desc id="desc">转写、画面和用户要求先合并为可追溯的知识，再经过蓝图、章节和质量审计形成文档。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#111827}.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#4b5563}.box{fill:#fff;stroke:#374151;stroke-width:1.5}.active{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.h{font-size:16px;font-weight:700}.t{font-size:12px;fill:#4b5563}.arrow{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:6 5;fill:none}</style>
  </defs>
  <rect width="1080" height="560" fill="#fff"/>
  <text x="540" y="42" text-anchor="middle" class="title">知识与编辑流程</text>
  <text x="540" y="68" text-anchor="middle" class="subtitle">先确认“依据是什么”，再决定“文档怎样写”</text>

  <text x="120" y="108" text-anchor="middle" class="t">输入</text>
  <rect x="45" y="128" width="150" height="64" rx="4" class="box"/>
  <text x="120" y="156" text-anchor="middle" class="h">转写</text><text x="120" y="178" text-anchor="middle" class="t">文字 + 时间戳</text>
  <rect x="45" y="228" width="150" height="64" rx="4" class="box"/>
  <text x="120" y="256" text-anchor="middle" class="h">画面</text><text x="120" y="278" text-anchor="middle" class="t">经过核验的帧</text>
  <rect x="45" y="328" width="150" height="64" rx="4" class="box"/>
  <text x="120" y="356" text-anchor="middle" class="h">用户要求</text><text x="120" y="378" text-anchor="middle" class="t">详略与偏好</text>

  <path d="M195 160H240V260H285" class="arrow"/>
  <path d="M195 260H285" class="arrow"/>
  <path d="M195 360H240V260H285" class="arrow"/>

  <rect x="285" y="212" width="190" height="96" rx="4" class="active"/>
  <text x="380" y="245" text-anchor="middle" class="h">建立可追溯知识</text>
  <text x="380" y="270" text-anchor="middle" class="t">CourseIR + 知识单元</text>
  <text x="380" y="291" text-anchor="middle" class="t">每条内容保留来源</text>

  <path d="M475 260H520" class="arrow"/>
  <rect x="520" y="212" width="150" height="96" rx="4" class="box"/>
  <text x="595" y="245" text-anchor="middle" class="h">规划文档</text>
  <text x="595" y="270" text-anchor="middle" class="t">策略 + 蓝图</text>
  <text x="595" y="291" text-anchor="middle" class="t">确定章节与证据</text>

  <path d="M670 260H715" class="arrow"/>
  <rect x="715" y="212" width="150" height="96" rx="4" class="box"/>
  <text x="790" y="245" text-anchor="middle" class="h">写作组装</text>
  <text x="790" y="270" text-anchor="middle" class="t">章节 → v3.1</text>
  <text x="790" y="291" text-anchor="middle" class="t">不补造证据</text>

  <path d="M865 260H910" class="arrow"/>
  <rect x="910" y="212" width="130" height="96" rx="4" class="active"/>
  <text x="975" y="245" text-anchor="middle" class="h">质量审计</text>
  <text x="975" y="270" text-anchor="middle" class="t">内容与页面</text>
  <text x="975" y="291" text-anchor="middle" class="t">必要时局部修订</text>

  <path d="M975 308V410H790" class="arrow"/>
  <rect x="640" y="410" width="300" height="70" rx="4" class="box"/>
  <text x="790" y="440" text-anchor="middle" class="h">统一内容结构</text>
  <text x="790" y="462" text-anchor="middle" class="t">真实记录来源、能力层级与降级原因</text>

  <rect x="285" y="410" width="250" height="70" rx="4" class="box"/>
  <text x="410" y="438" text-anchor="middle" class="h">可选云端增强</text>
  <text x="410" y="462" text-anchor="middle" class="t">逐次授权；失败则回到本地链</text>
  <path d="M410 410V338H595V308" class="dash"/>

  <text x="540" y="530" text-anchor="middle" class="t">本地确定性链始终可完成；模型只能查询批准的证据并提交结构化结果</text>
</svg>
