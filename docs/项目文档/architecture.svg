<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">知影从视频证据到三种文档的整体架构</title>
  <desc id="desc">视频在本地形成文字和画面证据，经过知识组织与可选云端增强后成为统一内容结构，再由本地质量检查和三个渲染器生成文档；底层执行器负责缓存、提交和恢复。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#111827}.title{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#4b5563}.h{font-size:17px;font-weight:700}.t{font-size:13px}.note{font-size:12px;fill:#4b5563}.box{fill:#fff;stroke:#374151;stroke-width:1.5}.focus{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.flow{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#arrow)}.optional{stroke:#6b7280;stroke-width:1.5;stroke-dasharray:6 5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fff"/>
  <text x="640" y="42" text-anchor="middle" class="title">从视频证据到可读文档</text>
  <text x="640" y="69" text-anchor="middle" class="sub">主线始终在本地完成；云端 LLM 是知识组织和文档编辑的可选增强</text>

  <rect x="30" y="200" width="160" height="125" rx="5" class="box"/>
  <text x="110" y="236" text-anchor="middle" class="h">输入</text>
  <text x="110" y="267" text-anchor="middle" class="t">本地视频 / 视频链接</text>
  <text x="110" y="293" text-anchor="middle" class="t">用户的整理要求</text>

  <path d="M190 262H235" class="flow"/>
  <rect x="235" y="145" width="225" height="235" rx="5" class="focus"/>
  <text x="347" y="180" text-anchor="middle" class="h">本地证据提取</text>
  <text x="265" y="219" class="t">音频 → 带时间戳的转写</text>
  <text x="265" y="252" class="t">视频 → 完整候选图片池</text>
  <text x="265" y="285" class="t">OCR / VLM → 可见事实</text>
  <text x="265" y="318" class="t">每条结果保留来源与时间</text>
  <text x="347" y="354" text-anchor="middle" class="note">原视频、音频和图片不离开本机</text>

  <path d="M460 262H505" class="flow"/>
  <rect x="505" y="145" width="225" height="235" rx="5" class="box"/>
  <text x="617" y="180" text-anchor="middle" class="h">知识组织</text>
  <text x="535" y="219" class="t">课程计划与知识单元</text>
  <text x="535" y="252" class="t">文字来源与视觉证据对齐</text>
  <text x="535" y="285" class="t">知识点的详略和图文需要</text>
  <text x="535" y="318" class="t">本地规则可完整生成</text>
  <text x="617" y="354" text-anchor="middle" class="note">授权后可用云端提升组织质量</text>

  <rect x="505" y="440" width="225" height="120" rx="5" class="box"/>
  <text x="617" y="476" text-anchor="middle" class="h">云端 LLM（可选）</text>
  <text x="617" y="506" text-anchor="middle" class="t">规划 / 知识组织 / 写作 / 修订</text>
  <text x="617" y="533" text-anchor="middle" class="note">只收裁剪后的结构化文字</text>
  <path d="M617 440V395" class="optional"/>

  <path d="M730 262H775" class="flow"/>
  <rect x="775" y="145" width="225" height="235" rx="5" class="focus"/>
  <text x="887" y="180" text-anchor="middle" class="h">统一内容结构</text>
  <text x="805" y="219" class="t">章节与段落</text>
  <text x="805" y="252" class="t">列表、公式和图片</text>
  <text x="805" y="285" class="t">来源引用与生成记录</text>
  <text x="805" y="318" class="t">组件级质量检查</text>
  <text x="887" y="354" text-anchor="middle" class="note">内容只组织一次，输出共享语义</text>

  <path d="M1000 262H1045" class="flow"/>
  <rect x="1045" y="145" width="205" height="235" rx="5" class="box"/>
  <text x="1147" y="180" text-anchor="middle" class="h">渲染与核验</text>
  <text x="1075" y="224" class="t">Markdown</text>
  <text x="1075" y="260" class="t">Word（原生公式）</text>
  <text x="1075" y="296" class="t">PDF</text>
  <text x="1075" y="332" class="t">渲染产物检查</text>
  <text x="1147" y="354" text-anchor="middle" class="note">成功 / 降级 / 失败</text>

  <rect x="235" y="610" width="765" height="70" rx="5" class="box"/>
  <text x="617" y="638" text-anchor="middle" class="h">本地执行基础</text>
  <text x="617" y="663" text-anchor="middle" class="t">23 个可恢复节点 · 输入指纹与缓存 · 临时目录执行 · 校验后原子提交 · 检查点恢复</text>
  <path d="M347 380V610" class="optional"/><path d="M617 560V610" class="optional"/><path d="M887 380V610" class="optional"/>
</svg>
