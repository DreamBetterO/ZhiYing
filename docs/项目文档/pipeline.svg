<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">知影视频处理流水线</title>
  <desc id="desc">视频依次经过获取、转写、画面证据、知识整理、编辑、文档结构和三端输出。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#111827}.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#4b5563}.box{fill:#fff;stroke:#374151;stroke-width:1.5}.active{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.h{font-size:16px;font-weight:700}.t{font-size:12px;fill:#4b5563}.arrow{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1080" height="520" fill="#fff"/>
  <text x="540" y="42" text-anchor="middle" class="title">一段视频怎样变成文档</text>
  <text x="540" y="68" text-anchor="middle" class="subtitle">主路径从左到右；任一步失败都按合同降级或停止</text>

  <rect x="48" y="115" width="150" height="82" rx="4" class="box"/>
  <text x="123" y="148" text-anchor="middle" class="h">1　获取视频</text><text x="123" y="174" text-anchor="middle" class="t">本地文件或链接</text>
  <path d="M198 156H226" class="arrow"/>
  <rect x="226" y="115" width="150" height="82" rx="4" class="box"/>
  <text x="301" y="148" text-anchor="middle" class="h">2　生成转写</text><text x="301" y="174" text-anchor="middle" class="t">音频、文字、时间戳</text>
  <path d="M376 156H404" class="arrow"/>
  <rect x="404" y="115" width="150" height="82" rx="4" class="box"/>
  <text x="479" y="148" text-anchor="middle" class="h">3　寻找画面</text><text x="479" y="174" text-anchor="middle" class="t">候选帧与视觉证据</text>
  <path d="M554 156H582" class="arrow"/>
  <rect x="582" y="115" width="150" height="82" rx="4" class="active"/>
  <text x="657" y="148" text-anchor="middle" class="h">4　整理知识</text><text x="657" y="174" text-anchor="middle" class="t">CourseIR 与知识单元</text>
  <path d="M732 156H760" class="arrow"/>
  <rect x="760" y="115" width="150" height="82" rx="4" class="box"/>
  <text x="835" y="148" text-anchor="middle" class="h">5　编辑质检</text><text x="835" y="174" text-anchor="middle" class="t">蓝图、章节、审计</text>
  <path d="M910 156H938" class="arrow"/>
  <rect x="938" y="115" width="94" height="82" rx="4" class="box"/>
  <text x="985" y="148" text-anchor="middle" class="h">6　组装</text><text x="985" y="174" text-anchor="middle" class="t">v3.1</text>

  <path d="M985 197V262H540" class="arrow"/>
  <rect x="335" y="262" width="410" height="76" rx="4" class="active"/>
  <text x="540" y="294" text-anchor="middle" class="h">7　形成统一内容结构</text>
  <text x="540" y="318" text-anchor="middle" class="t">统一保存正文、公式、图片和来源链接</text>

  <path d="M540 338V378H225V400" class="arrow"/>
  <path d="M540 338V400" class="arrow"/>
  <path d="M540 338V378H855V400" class="arrow"/>
  <rect x="135" y="400" width="180" height="62" rx="4" class="box"/>
  <text x="225" y="438" text-anchor="middle" class="h">Markdown</text>
  <rect x="450" y="400" width="180" height="62" rx="4" class="box"/>
  <text x="540" y="438" text-anchor="middle" class="h">Word</text>
  <rect x="765" y="400" width="180" height="62" rx="4" class="box"/>
  <text x="855" y="438" text-anchor="middle" class="h">PDF</text>

  <text x="540" y="495" text-anchor="middle" class="t">每一步提交 Artifact；缓存命中时不重复计算；所有重要内容保留来源</text>
</svg>
