    owner: video_study.editorial.agent
    public_interfaces: [video_study.editorial.agent:build_editorial_agent, video_study.execution.steps.editorial_steps:run_editorial_session, video_study.editorial.intent:compile_editorial_policy, video_study.editorial.local:build_local_blueprint, video_study.editorial.local:compose_local_document, video_study.editorial.quality:audit_document_v31]
