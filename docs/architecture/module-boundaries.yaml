    forbidden_dependencies: [desktop, providers, knowledge.planning, openai]
    artifacts: [document.v3]
    steps: [render.markdown, render.word, render.pdf, render.verify]
    tests: [tests/test_render_content_blocks.py, tests/test_pdf_conversion.py, tests/test_v61_native_renderers.py]
