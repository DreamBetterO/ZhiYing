    forbidden_dependencies: [tkinter, knowledge, openai, subprocess]
    artifacts: []
    steps: []
    tests: [tests/test_processing_service.py]
  - id: desktop
    owner: video_study.desktop.controller
    public_interfaces: [video_study.desktop.controller:DesktopController, video_study.desktop.view:DesktopView]
    allowed_dependencies: [application, desktop.models, desktop.settings]
    forbidden_dependencies: [knowledge, providers, execution.graph_runtime, subprocess, openai]
    artifacts: []
    steps: []
    tests: [tests/test_desktop_controller.py, tests/test_desktop_settings.py, tests/test_desktop.py]
  - id: execution
    owner: video_study.execution.graph_runtime
    public_interfaces: [video_study.execution.graph_runtime:GraphRuntime, video_study.execution.context:ProcessingContext, video_study.execution.contracts:PipelineStep, video_study.execution.registry:StepRegistry, video_study.execution.artifacts:ArtifactStore, video_study.execution.cache:WorkspaceCache]
