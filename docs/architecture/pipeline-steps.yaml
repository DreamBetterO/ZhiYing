schema_version: 1
source_of_truth: zhiying.execution.graph_runtime:GraphRuntime
contract_test: tests/test_documentation_contracts.py
architecture_version: V6.1
status: implemented_and_validated
validated_at: "2026-09-03 19:28 Asia/Shanghai"
runtime_contracts:
  cloud_organizer:
    batching: "默认每批一个知识单元；organizer_max_units_per_batch 可调"
    output_limit: "organizer_request_max_output_tokens=0 时不发送 API max_tokens；正整数为显式硬上限"
    identity_boundary: "plan/source/claim ID 只能收敛到当前 CloudPayload/CourseIR 授权集合"
    failure_policy: "无法安全规范化时才降级，不因可恢复的标签漂移放弃整批"
  editorial_writer:
    topology_authority: "本地 DocumentBlueprint"
    cloud_mutation_scope: "只修改已知组件内容；缺失保留本地内容，多余组件丢弃"
  cloud_cache:
    accepted_capabilities: [cloud, tool_native, structured_only]
    reject_when_status: degraded
steps:
  - {id: source.probe, owner: zhiying.execution.steps.coarse, depends_on: [], inputs: [], outputs: [source.manifest], error_prefix: SOURCE, tests: [tests/test_coarse_pipeline.py]}
  - {id: audio.extract, owner: zhiying.execution.steps.coarse, depends_on: [source.probe], inputs: [source.manifest], outputs: [audio.flac], error_prefix: AUDIO, tests: [tests/test_coarse_pipeline.py]}
  - {id: transcript.decode, owner: zhiying.execution.steps.coarse, depends_on: [audio.extract, source.probe], inputs: [audio.flac, source.manifest], outputs: [transcript.raw], error_prefix: TRANSCRIPT_DECODE, tests: [tests/test_fine_pipeline.py]}
  - {id: transcript.normalize, owner: zhiying.execution.steps.coarse, depends_on: [transcript.decode, source.probe], inputs: [transcript.raw, source.manifest], outputs: [transcript.normalized, transcript.srt], error_prefix: TRANSCRIPT_NORMALIZE, tests: [tests/test_fine_pipeline.py]}
  - {id: frames.candidates, owner: zhiying.execution.steps.coarse, depends_on: [source.probe], inputs: [source.manifest], outputs: [frames.candidates], error_prefix: FRAMES_CANDIDATES, tests: [tests/test_fine_pipeline.py]}
  - {id: frames.select, owner: zhiying.execution.steps.coarse, depends_on: [frames.candidates, transcript.normalize, source.probe], inputs: [frames.candidates, transcript.normalized, source.manifest], outputs: [frames.selected], error_prefix: FRAMES_SELECT, tests: [tests/test_fine_pipeline.py]}
  - {id: knowledge.plan, owner: zhiying.execution.steps.knowledge, depends_on: [transcript.normalize], inputs: [transcript.normalized], outputs: [knowledge.plan], error_prefix: KNOWLEDGE_PLAN, tests: [tests/test_knowledge_planning.py]}
  - {id: visual.jobs, owner: zhiying.execution.steps.knowledge, depends_on: [knowledge.plan, frames.candidates, transcript.normalize], inputs: [knowledge.plan, frames.candidates, transcript.normalized], outputs: [visual.jobs], error_prefix: VISUAL_JOBS, tests: [tests/test_visual_retrieval.py]}
  - {id: visual.evidence, owner: zhiying.execution.steps.knowledge, depends_on: [visual.jobs, knowledge.plan, frames.candidates, transcript.normalize], inputs: [visual.jobs, knowledge.plan, frames.candidates, transcript.normalized], outputs: [visual.evidence], error_prefix: VISUAL_EVIDENCE, tests: [tests/test_visual_retrieval.py, tests/test_vision_providers.py]}
  - {id: frames.semantics, owner: zhiying.execution.steps.knowledge, depends_on: [frames.select, transcript.normalize], inputs: [frames.selected, transcript.normalized], outputs: [frames.semantics], error_prefix: FRAME_SEMANTICS, tests: [tests/test_visuals.py]}
  - {id: knowledge.course_ir, owner: zhiying.execution.steps.knowledge, depends_on: [knowledge.plan, transcript.normalize, visual.evidence], inputs: [knowledge.plan, transcript.normalized, visual.evidence], outputs: [knowledge.course_ir], error_prefix: COURSE_IR, tests: [tests/test_cloud_payload.py]}
  - {id: knowledge.units, owner: zhiying.execution.steps.knowledge, depends_on: [knowledge.plan, knowledge.course_ir, frames.semantics, visual.evidence, transcript.normalize], inputs: [knowledge.plan, knowledge.course_ir, frames.semantics, visual.evidence, transcript.normalized], outputs: [knowledge.units], error_prefix: KNOWLEDGE_UNITS, tests: [tests/test_knowledge_organizer.py, tests/test_cloud_payload.py]}
  - {id: knowledge.selfcheck, owner: zhiying.execution.steps.knowledge, depends_on: [knowledge.units, knowledge.plan, transcript.normalize, frames.select], inputs: [knowledge.units, knowledge.plan, transcript.normalized, frames.selected], outputs: [knowledge.selfcheck], error_prefix: KNOWLEDGE_SELFCHECK, tests: [tests/test_knowledge_selfcheck.py]}
  - {id: editorial.policy, owner: zhiying.execution.steps.editorial_steps, depends_on: [], inputs: [], outputs: [editorial.policy], error_prefix: EDITORIAL_POLICY, tests: [tests/test_v61_editorial_policy.py]}
  - {id: evidence.reconcile, owner: zhiying.execution.steps.editorial_steps, depends_on: [transcript.normalize], inputs: [transcript.normalized], outputs: [evidence.corrections], error_prefix: EVIDENCE_RECONCILE, tests: [tests/test_v61_evidence_overlay.py]}
  - {id: document.blueprint, owner: zhiying.execution.steps.editorial_steps, depends_on: [knowledge.plan, knowledge.selfcheck, knowledge.units, visual.evidence, editorial.policy, evidence.reconcile, transcript.normalize, source.probe], inputs: [knowledge.plan, knowledge.selfcheck, knowledge.units, visual.evidence, editorial.policy, evidence.corrections, transcript.normalized, source.manifest], outputs: [document.blueprint, editorial.session], error_prefix: DOCUMENT_BLUEPRINT, tests: [tests/test_v61_local_editor.py, tests/test_v61_editorial_graph.py]}
  - {id: document.write, owner: zhiying.execution.steps.editorial_steps, depends_on: [document.blueprint, knowledge.plan, knowledge.units, evidence.reconcile, visual.evidence], inputs: [document.blueprint, editorial.session, knowledge.plan, knowledge.units, evidence.corrections, visual.evidence], outputs: [document.chapter_v31], error_prefix: DOCUMENT_WRITE, tests: [tests/test_v61_local_editor.py, tests/test_v61_editorial_graph.py]}
  - {id: document.assemble, owner: zhiying.execution.steps.editorial_steps, depends_on: [document.write, source.probe, transcript.normalize], inputs: [document.chapter_v31, source.manifest, transcript.normalized], outputs: [document.v3], error_prefix: DOCUMENT_ASSEMBLE, tests: [tests/test_v61_local_editor.py]}
  - {id: document.validate, owner: zhiying.execution.steps.editorial_steps, depends_on: [document.assemble, editorial.policy], inputs: [document.v3, editorial.policy], outputs: [document.validation], error_prefix: DOCUMENT_VALIDATE, tests: [tests/test_v61_quality.py, tests/test_v61_local_editor.py]}
  - {id: render.markdown, owner: zhiying.execution.steps.coarse, depends_on: [document.assemble, document.validate], inputs: [document.v3, document.validation], outputs: [render.markdown.draft], error_prefix: RENDER, tests: [tests/test_coarse_pipeline.py]}
  - {id: render.word, owner: zhiying.execution.steps.coarse, depends_on: [document.assemble, document.validate, render.markdown], inputs: [document.v3, document.validation, render.markdown.draft], outputs: [render.word.draft], error_prefix: RENDER, tests: [tests/test_coarse_pipeline.py]}
  - {id: render.pdf, owner: zhiying.execution.steps.coarse, depends_on: [document.assemble, document.validate, render.word], inputs: [document.v3, document.validation, render.word.draft], outputs: [render.pdf.draft], error_prefix: RENDER, tests: [tests/test_coarse_pipeline.py]}
  - {id: render.verify, owner: zhiying.execution.steps.coarse, depends_on: [document.assemble, render.markdown, render.word, render.pdf], inputs: [document.v3, render.markdown.draft, render.word.draft, render.pdf.draft], outputs: [document.v2], error_prefix: RENDER, tests: [tests/test_coarse_pipeline.py]}
