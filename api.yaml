qwen:
  provider: dashscope_openai_compatible
  enabled: false
  enabled_env: CLOUD_LLM_ENABLED
  api_key_env: QWEN_API_KEY
  base_url_env: QWEN_BASE_URL
  model_chain_env: QWEN_MODEL_CHAIN
  default_base_url: https://ws-e1wkkzn2116yp0ii.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  default_models:
  - qwen3.7-flash-2026-07-15
  model_capabilities:
    glm-5.2: tool_native
    deepseek-v4-flash-0731: structured_only
    kimi-k2.6: structured_only
    qwen3.7-plus: structured_only
  budget:
    max_calls_per_video: 12
    max_input_chars: 60000
    compact_max_output_tokens: 8000
    planning_max_output_tokens: 12000
    max_output_tokens: 12000
    rich_max_output_tokens: 16000
    organizer_request_max_output_tokens: 0
    organizer_max_units_per_batch: 1
  max_calls_env: QWEN_MAX_CALLS_PER_VIDEO
  max_input_chars_env: QWEN_MAX_INPUT_CHARS
  max_output_tokens_env: QWEN_MAX_OUTPUT_TOKENS
  planning_max_output_tokens_env: QWEN_PLANNING_MAX_OUTPUT_TOKENS
  rich_max_output_tokens_env: QWEN_RICH_MAX_OUTPUT_TOKENS
  organizer_request_max_output_tokens_env: QWEN_ORGANIZER_MAX_OUTPUT_TOKENS
  timeout_seconds: 240
  compact_timeout_seconds: 180
  rich_timeout_seconds: 360
  timeout_seconds_env: QWEN_TIMEOUT_SECONDS
