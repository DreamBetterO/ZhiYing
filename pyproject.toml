[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiying"
version = "1.0.0"
description = "知影：可溯源的桌面端视频学习文档工作台"
readme = "README.md"
authors = [{ name = "DreamBetterO" }]
license = { file = "LICENSE" }
keywords = ["video", "education", "summarization", "desktop", "markdown", "docx", "pdf"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Education",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "faster-whisper>=1.1.1,<2",
  "huggingface-hub[cli]>=0.27,<2",
  "openai>=1.60,<3",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "reportlab>=4.2,<5",
  "pypdf>=5,<7",
  "defusedxml>=0.7,<1",
  "lxml>=6,<7",
  "python-dotenv>=1,<2",
  "langgraph>=1.0.10,<2",
  "langgraph-checkpoint-sqlite>=3.0.1,<4",
]

[project.scripts]
zhiying = "zhiying.cli:main"
video-study = "zhiying.cli:main"

[project.urls]
Homepage = "https://github.com/DreamBetterO/ZhiYing"
Documentation = "https://github.com/DreamBetterO/ZhiYing/tree/main/docs"
Issues = "https://github.com/DreamBetterO/ZhiYing/issues"
Releases = "https://github.com/DreamBetterO/ZhiYing/releases"

[tool.setuptools.packages.find]
where = ["src"]
