[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-study"
version = "1.0.0rc1"
description = "Traceable desktop teaching-video to study-document workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1.1,<2",
  "huggingface-hub[cli]>=0.27,<2",
  "openai>=1.60,<3",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "reportlab>=4.2,<5",
  "pypdf>=5,<7",
  "defusedxml>=0.7,<1",
  "lxml>=6,<7",
  "python-dotenv>=1,<2",
  "langgraph>=1.0.10,<2",
  "langgraph-checkpoint-sqlite>=3.0.1,<4",
]

[project.scripts]
video-study = "video_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
