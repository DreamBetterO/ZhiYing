[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-study"
version = "0.4.0"
description = "Traceable desktop teaching-video to study-document workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1.1,<2",
  "huggingface-hub[cli]>=0.27,<2",
  "openai>=1.60,<3",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "reportlab>=4.2,<5",
  "pypdf>=5,<7",
  "defusedxml>=0.7,<1",
  "lxml>=6,<7",
  "python-dotenv>=1,<2",
]

[project.scripts]
video-study = "video_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
