purpose: "供执行 Agent 按需检索；不是用户版本时间线"
schema_version: 1

architecture:
  knowledge_layer:
    - schema
    - planning
    - organizer
    - course_ir
    - cloud_payload
    - visual_retrieval
    - selfcheck
    - adapter
    - prompts
  execution_layer:
    - context
    - contracts
    - artifacts
    - cache
    - ports
    - registry
    - runner
    - steps
  document_flow: "15-step DAG -> Canonical Document v2 -> Markdown -> Word -> PDF"
  compatibility: "旧 Workspace 和 Document v1 仅单向只读认领；生产只写 v2"
  cloud_entrypoints:
    - plan_cloud
    - organize_cloud
    - aggregate_documents

known_edges:
  short_video_frame_padding:
    symptom: "视频接近或短于 content_start_padding_seconds 时，候选可能被全部过滤并触发空列表错误"
    current_workaround: "短视频测试将 padding 设为 0"
    proper_fix: "候选过滤前检测 content_start >= duration 或空候选，并安全回退到有效时间范围"
  shared_manifest_concurrency:
    symptom: "同一任务并发写 manifest 可能出现 PermissionError"
    guidance: "相同任务目录串行处理；不要用并发掩盖写入竞争"

validation_guidance:
  - "优先复用已有 ASR、帧和知识缓存，不无理由重跑长视频"
  - "无云端授权时使用 fixture/fake provider 验证程序链路，不伪装成真实模型质量验证"

